name: tmp-hwp-build-v104

on:
  push:
    branches:
      - tmp-hwp-build-v104
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch HWP writer
        run: git clone --depth 1 https://github.com/yuyu04/hwpkit.git /tmp/hwpkit

      - name: Build HWP
        run: |
          node /tmp/hwpkit/scripts/hwp-write.mjs tmp_hwp_build/report.md KLS_LLRF_Cavity_Tuner_Internal_Report_V1.0.4.hwp

      - name: Round-trip read validation
        run: |
          node /tmp/hwpkit/scripts/hwp-read.mjs KLS_LLRF_Cavity_Tuner_Internal_Report_V1.0.4.hwp > roundtrip.txt
          test -s roundtrip.txt
          grep -q "KLS LLRF" roundtrip.txt
          grep -q "PHYTRON MCC-1" roundtrip.txt

      - name: Preview validation
        run: |
          mkdir -p preview
          node /tmp/hwpkit/scripts/hwp-preview.mjs KLS_LLRF_Cavity_Tuner_Internal_Report_V1.0.4.hwp preview --pages 1-3
          test -n "$(find preview -type f | head -n 1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KLS_LLRF_Cavity_Tuner_Internal_Report_V1.0.4
          path: |
            KLS_LLRF_Cavity_Tuner_Internal_Report_V1.0.4.hwp
            roundtrip.txt
            preview/
          if-no-files-found: error
