name: tmp-hwp-build-v104

on:
  push:
    branches:
      - tmp-hwp-build-v104
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch HWP writer
        run: git clone --depth 1 https://github.com/yuyu04/hwpkit.git /tmp/hwpkit

      - name: Patch HWP-native page breaks and alignment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tmp_hwp_build/build_v106.mjs')
          s = p.read_text(encoding='utf-8')

          # rhwp ParaShape parser requires lowercase alignment strings.
          s = s.replace("'Justify'", "'justify'")
          s = s.replace("'Center'", "'center'")
          s = s.replace("'Left'", "'left'")
          s = s.replace("'Right'", "'right'")

          # Use the HWP-native paragraph pageBreakBefore property.
          s = s.replace('let pi = 0;\nconst headingParas', 'let pi = 0;\nlet forcePageBreak = false;\nconst headingParas')
          old_pb = """function pageBreak() {\n  const r = JSON.parse(doc.insertPageBreak(SEC, pi, 0));\n  pi = (r.paraIdx ?? (pi + 1));\n}"""
          new_pb = """function pageBreak() {\n  forcePageBreak = true;\n}"""
          if old_pb not in s:
              raise SystemExit('original pageBreak source pattern not found')
          s = s.replace(old_pb, new_pb)

          old_wp = """  fmtText(idx, 0, t.length, opts);\n  fmtPara(idx, opts);\n  const len = doc.getParagraphLength(SEC, idx);"""
          new_wp = """  fmtText(idx, 0, t.length, opts);\n  fmtPara(idx, opts);\n  if (forcePageBreak) {\n    try { doc.applyParaFormat(SEC, idx, JSON.stringify({pageBreakBefore:true})); } catch(e) {}\n    forcePageBreak = false;\n  }\n  const len = doc.getParagraphLength(SEC, idx);"""
          if old_wp not in s:
              raise SystemExit('writeP source pattern not found')
          s = s.replace(old_wp, new_wp)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Build corrected HWP V1.0.6
        run: node tmp_hwp_build/build_v106.mjs 2> build.log

      - name: Round-trip read validation
        run: |
          node /tmp/hwpkit/scripts/hwp-read.mjs KLS_LLRF_Cavity_Tuner_Internal_Report_V1.0.6.hwp > roundtrip.txt
          test -s roundtrip.txt
          grep -q "KLS LLRF" roundtrip.txt
          grep -q "INTERNAL REPORT" roundtrip.txt
          grep -q "목    차" roundtrip.txt
          grep -q "PHYTRON MCC-1" roundtrip.txt
          grep -q "STEP_REF" roundtrip.txt
          grep -q "T0" roundtrip.txt
          grep -q "결론 및 향후 수행 항목" roundtrip.txt

      - name: Preview validation
        run: |
          mkdir -p preview
          node /tmp/hwpkit/scripts/hwp-preview.mjs KLS_LLRF_Cavity_Tuner_Internal_Report_V1.0.6.hwp preview --png --pages 1-12 --scale 1.5
          test -n "$(find preview -type f | head -n 1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KLS_LLRF_Cavity_Tuner_Internal_Report_V1.0.6
          path: |
            KLS_LLRF_Cavity_Tuner_Internal_Report_V1.0.6.hwp
            build.log
            roundtrip.txt
            v106_page1.svg
            v106_page2.svg
            v106_page3.svg
            v106_page4.svg
            preview/
          if-no-files-found: error
