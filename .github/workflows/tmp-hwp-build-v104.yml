name: tmp-hwp-build-v104

on:
  push:
    branches:
      - tmp-hwp-build-v104
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch HWP writer
        run: git clone --depth 1 https://github.com/yuyu04/hwpkit.git /tmp/hwpkit

      - name: Patch page transitions for stable pagination
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tmp_hwp_build/build_v106.mjs')
          s = p.read_text(encoding='utf-8')
          old = """function pageBreak() {\n  const r = JSON.parse(doc.insertPageBreak(SEC, pi, 0));\n  pi = (r.paraIdx ?? (pi + 1));\n}"""
          new = """function pageBreak() {\n  let basePage = 0;\n  try { basePage = JSON.parse(doc.getCursorRect(SEC, Math.max(0, pi-1), 0)).pageIndex; } catch(e) {}\n  for (let guard=0; guard<120; guard++) {\n    let curPage = basePage;\n    try { curPage = JSON.parse(doc.getCursorRect(SEC, pi, 0)).pageIndex; } catch(e) {}\n    if (curPage > basePage) return;\n    writeP(' ', {size:PT(11), align:'Left', line:100, before:0, after:0});\n  }\n  throw new Error('natural page transition guard exceeded');\n}"""
          if old not in s:
              raise SystemExit('pageBreak source pattern not found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build corrected HWP V1.0.6
        run: node tmp_hwp_build/build_v106.mjs 2> build.log

      - name: Round-trip read validation
        run: |
          node /tmp/hwpkit/scripts/hwp-read.mjs KLS_LLRF_Cavity_Tuner_Internal_Report_V1.0.6.hwp > roundtrip.txt
          test -s roundtrip.txt
          grep -q "KLS LLRF" roundtrip.txt
          grep -q "INTERNAL REPORT" roundtrip.txt
          grep -q "목    차" roundtrip.txt
          grep -q "PHYTRON MCC-1" roundtrip.txt
          grep -q "STEP_REF" roundtrip.txt
          grep -q "T0" roundtrip.txt
          grep -q "결론 및 향후 수행 항목" roundtrip.txt

      - name: Preview validation
        run: |
          mkdir -p preview
          node /tmp/hwpkit/scripts/hwp-preview.mjs KLS_LLRF_Cavity_Tuner_Internal_Report_V1.0.6.hwp preview --png --pages 1-12 --scale 1.5
          test -n "$(find preview -type f | head -n 1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KLS_LLRF_Cavity_Tuner_Internal_Report_V1.0.6
          path: |
            KLS_LLRF_Cavity_Tuner_Internal_Report_V1.0.6.hwp
            build.log
            roundtrip.txt
            v106_page1.svg
            v106_page2.svg
            v106_page3.svg
            v106_page4.svg
            preview/
          if-no-files-found: error
