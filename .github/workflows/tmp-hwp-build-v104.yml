name: tmp-hwp-build-v104

on:
  push:
    branches:
      - tmp-hwp-build-v104
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch HWP writer
        run: git clone --depth 1 https://github.com/yuyu04/hwpkit.git /tmp/hwpkit

      - name: Optimize report source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          src = Path('tmp_hwp_build/report.md')
          s = src.read_text(encoding='utf-8')

          # Keep the writer unmodified for maximum HWP compatibility.
          # Demote body headings only so the document has a clear hierarchy.
          marker = '\n# 1. 서론\n'
          if marker in s:
              pre, body = s.split(marker, 1)
              body = '# 1. 서론\n' + body
              body = re.sub(r'^## (\d+\.\d+\b.*)$', r'### \1', body, flags=re.M)
              body = re.sub(r'^# (\d+\. .*)$', r'## \1', body, flags=re.M)
              s = pre + '\n' + body

          # Remove stale page numbers from the manually written TOC.
          toc_start = s.find('**목 차**')
          body_start = s.find('\n## 1. 서론')
          if toc_start >= 0 and body_start > toc_start:
              a = s[:toc_start]
              toc = s[toc_start:body_start]
              b = s[body_start:]
              toc = re.sub(r'^(\s*(?:\d+(?:\.\d+)?\.?\s+.+?))\s+\d+\s*$', r'\1', toc, flags=re.M)
              s = a + toc + b

          # Preserve only the compact INTERNAL REPORT metadata table. Long
          # technical tables are rendered as structured label/detail bullets to
          # prevent cell-text interference in HWP viewers.
          lines = s.splitlines()
          out = []
          i = 0
          table_no = 0
          while i < len(lines):
              line = lines[i]
              if line.strip().startswith('|') and line.strip().endswith('|'):
                  tbl = []
                  j = i
                  while j < len(lines) and lines[j].strip().startswith('|') and lines[j].strip().endswith('|'):
                      tbl.append(lines[j])
                      j += 1
                  table_no += 1
                  rows = [[c.strip() for c in r.strip().strip('|').split('|')] for r in tbl]
                  if table_no == 1:
                      out.extend(tbl)
                  else:
                      data_rows = [r for k, r in enumerate(rows) if k != 1]
                      if data_rows:
                          header = [x.replace('**', '').strip() for x in data_rows[0]]
                          # One-cell callout tables become a bold callout paragraph.
                          if len(header) == 1 and len(data_rows) == 1:
                              out.append(f'**{header[0]}**')
                          else:
                              for r in data_rows[1:]:
                                  r = r + [''] * max(0, len(header) - len(r))
                                  key = r[0].replace('**', '').strip() if r else ''
                                  details = []
                                  for idx, val in enumerate(r[1:], start=1):
                                      val = val.replace('**', '').strip()
                                      if not val:
                                          continue
                                      label = header[idx] if idx < len(header) and header[idx] else f'항목 {idx+1}'
                                      details.append(f'{label}: {val}')
                                  if details:
                                      out.append(f'- **{key}** — ' + '; '.join(details))
                                  elif key:
                                      out.append(f'- {key}')
                      out.append('')
                  i = j
              else:
                  out.append(line)
                  i += 1

          s = '\n'.join(out) + '\n'
          s = re.sub(r'\n{3,}', '\n\n', s)
          Path('tmp_hwp_build/report_v107.md').write_text(s, encoding='utf-8')
          PY

      - name: Build HWP
        run: |
          node /tmp/hwpkit/scripts/hwp-write.mjs tmp_hwp_build/report_v107.md KLS_LLRF_Cavity_Tuner_Internal_Report_V1.0.7.hwp

      - name: Round-trip read validation
        run: |
          node /tmp/hwpkit/scripts/hwp-read.mjs KLS_LLRF_Cavity_Tuner_Internal_Report_V1.0.7.hwp > roundtrip.txt
          test -s roundtrip.txt
          grep -q "KLS LLRF" roundtrip.txt
          grep -q "PHYTRON MCC-1" roundtrip.txt
          grep -q "STEP_REF" roundtrip.txt
          grep -q "STOP" roundtrip.txt
          grep -q "결론 및 향후 수행 항목" roundtrip.txt

      - name: Preview validation
        run: |
          mkdir -p preview
          node /tmp/hwpkit/scripts/hwp-preview.mjs KLS_LLRF_Cavity_Tuner_Internal_Report_V1.0.7.hwp preview --pages 1-8
          test -n "$(find preview -type f | head -n 1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KLS_LLRF_Cavity_Tuner_Internal_Report_V1.0.7
          path: |
            KLS_LLRF_Cavity_Tuner_Internal_Report_V1.0.7.hwp
            roundtrip.txt
            preview/
          if-no-files-found: error
